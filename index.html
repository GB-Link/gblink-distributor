<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GB Link Distributor</title>
    <link rel="stylesheet" href="/src/assets/styles/style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header>
        <h1>GB Link Distributor</h1>
        <p class="subtitle">Event distribution Pokémon over link cable using GB Link USB adapter</p>
      </header>

      <section class="picker-section">
        <fieldset class="distribution-picker" id="distribution-picker">
          <legend>Choose your Pokémon</legend>
          <div class="distribution-options" id="distribution-options"></div>
        </fieldset>
      </section>

      <div id="workflow" class="hidden">
        <section class="panel" id="event-panel">
          <label for="event-select">Distribution event</label>
          <select id="event-select" aria-label="Select distribution event"></select>
        </section>

        <section class="status-panel">
          <div class="stepper" id="stepper">
            <div class="stepper-step" data-step="connect">
              <div class="step-node"></div>
              <span>Connect</span>
            </div>
            <div class="stepper-line"></div>
            <div class="stepper-step" data-step="cable-club">
              <div class="step-node"></div>
              <span>Cable Club</span>
            </div>
            <div class="stepper-line"></div>
            <div class="stepper-step" data-step="trade-center">
              <div class="step-node"></div>
              <span>Trade Center</span>
            </div>
            <div class="stepper-line"></div>
            <div class="stepper-step" data-step="trade">
              <div class="step-node"></div>
              <span>Trade</span>
            </div>
            <div class="stepper-line"></div>
            <div class="stepper-step" data-step="done">
              <div class="step-node"></div>
              <span>Done</span>
            </div>
          </div>

          <div class="status-row">
            <span id="status-indicator" class="indicator"></span>
            <p id="status-text" class="status"></p>
          </div>
          <p id="detail-text" class="detail"></p>

          <div id="instruction-box" class="instruction-box hidden">
            <span class="instruction-label">Next instructions</span>
            <span id="instruction-text"></span>
          </div>
        </section>

      <section class="panel certificate-panel hidden" id="certificate-panel" aria-label="Distribution certificate">
        <div id="certificate-mount"></div>
      </section>

      <div class="actions">
        <button type="button" id="connect-btn" class="primary">Connect Game Boy</button>
        <button type="button" id="disconnect-btn" class="secondary" disabled>Disconnect</button>
      </div>
    </div>

      <footer>
        <p>Requires Chrome, Edge or Firefox and a <a href="https://gblink.io" target="_blank" rel="noopener">GB Link USB adapter</a>.</p>
        <p class="footer-credit">Project by <a href="https://github.com/raphaelz" target="_blank" rel="noopener">raphaelz</a> · <a href="#" target="_blank" rel="noopener">Project source</a></p>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
